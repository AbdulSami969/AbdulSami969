# ┌──────────────────────────────────────────────────────────────┐
# │  Contribution Snake generator                                │
# │  PUT THIS FILE AT:  .github/workflows/snake.yml              │
# │  (inside your  username/username  repo)                      │
# │                                                              │
# │  After committing:                                           │
# │   1. Repo → Settings → Actions → General → Workflow          │
# │      permissions → enable "Read and write permissions".      │
# │   2. Repo → Actions → "Generate Snake" → Run workflow.       │
# │   3. It creates an "output" branch with the snake SVGs that  │
# │      the README already points to. Re-runs every 12 hours.   │
# └──────────────────────────────────────────────────────────────┘
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%237C5CFC&color_dots=%2315151F,%23A78BFA,%237C5CFC,%235B3FD6,%23E94FA1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
