<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none" role="img" aria-label="Abdul Sami — I turn ideas into products that ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C11"/>
      <stop offset="1" stop-color="#111018"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#E94FA1"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E94FA1"/>
      <stop offset="0.5" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <!-- typewriter clips -->
    <clipPath id="clipName"><rect x="90" y="120" width="0" height="90"><animate attributeName="width" values="0;560" dur="0.9s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/></rect></clipPath>
    <clipPath id="clipTag"><rect x="92" y="228" width="0" height="46"><animate attributeName="width" values="0;720" dur="1.8s" begin="1.35s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <!-- moving glow -->
  <circle cx="300" cy="90" r="320" fill="url(#glow)">
    <animate attributeName="cx" values="300;950;300" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;260;90" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- top gradient bar -->
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#topbar)"/>

  <!-- editor chrome -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0s" fill="freeze"/>
    <circle cx="42" cy="42" r="7" fill="#E06B5E"/>
    <circle cx="66" cy="42" r="7" fill="#E7A23A"/>
    <circle cx="90" cy="42" r="7" fill="#4BBF7B"/>
    <rect x="120" y="30" width="150" height="26" rx="7" fill="#15151F" stroke="#7C5CFC" stroke-opacity="0.35"/>
    <text x="140" y="48" font-family="'Courier New',monospace" font-size="14" fill="#A78BFA">abdulsami.tsx</text>
    <text x="1060" y="48" font-family="'Courier New',monospace" font-size="13" fill="#8A8A99">// samdev</text>
  </g>

  <!-- eyebrow -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
    <text x="92" y="104" font-family="'Courier New',monospace" font-size="16" letter-spacing="3" fill="#7C5CFC">&#47;&#47; FULL-STACK DEVELOPER &amp; MVP SPECIALIST</text>
  </g>

  <!-- NAME (typewriter clip) -->
  <g clip-path="url(#clipName)">
    <text x="90" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="800" fill="url(#purple)" letter-spacing="-1">Abdul Sami</text>
  </g>
  <!-- name cursor -->
  <rect x="92" y="126" width="6" height="76" fill="#A78BFA">
    <animate attributeName="x" values="98;650" dur="0.9s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.6;1" dur="0.6s" begin="1.3s" fill="freeze"/>
  </rect>

  <!-- TAGLINE (typewriter clip) -->
  <g clip-path="url(#clipTag)">
    <text x="94" y="262" font-family="'Courier New',monospace" font-size="26" fill="#F5F5FA">I turn ideas into <tspan fill="#A78BFA">products that ship</tspan>.</text>
  </g>
  <!-- tagline blinking cursor -->
  <rect x="94" y="242" width="12" height="26" fill="#7C5CFC" opacity="0">
    <animate attributeName="x" values="100;712" dur="1.8s" begin="1.35s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.35s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- proof chips -->
  <g font-family="'Courier New',monospace" font-size="14" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.2s" fill="freeze"/>
    <g>
      <rect x="92" y="292" width="150" height="30" rx="15" fill="#15151F" stroke="#7C5CFC" stroke-opacity="0.4"/>
      <text x="110" y="312" fill="#F5F5FA">7+ yrs</text>
      <circle cx="100" cy="307" r="3" fill="#7C5CFC"/>
    </g>
    <g>
      <rect x="256" y="292" width="200" height="30" rx="15" fill="#15151F" stroke="#7C5CFC" stroke-opacity="0.4"/>
      <text x="274" y="312" fill="#F5F5FA">Top Rated · Upwork</text>
      <circle cx="264" cy="307" r="3" fill="#A78BFA"/>
    </g>
    <g>
      <rect x="470" y="292" width="190" height="30" rx="15" fill="#15151F" stroke="#7C5CFC" stroke-opacity="0.4"/>
      <text x="488" y="312" fill="#F5F5FA">13 countries · Lahore</text>
      <circle cx="478" cy="307" r="3" fill="#E94FA1"/>
    </g>
  </g>
</svg>
